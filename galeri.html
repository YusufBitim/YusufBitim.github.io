<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galeri | Yusuf Bitim</title>

<meta name="description" content="Yusuf Bitim şiir dünyasından görseller, sanat ve ilham galerisi.">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

header{
background:#000;
padding:20px;
text-align:center;
}

header a{
color:#d4af37;
text-decoration:none;
font-weight:bold;
font-size:18px;
}

main{
max-width:1000px;
margin:50px auto;
padding:20px;
}

h1{
text-align:center;
color:#d4af37;
margin-bottom:40px;
font-size:38px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}


.gallery img{

width:100%;
height:250px;
object-fit:contain;
background:#000;
border-radius:15px;
border:2px solid #d4af37;
transition:.3s;

}

.gallery img:hover{
transform:scale(1.05);
}

footer{
text-align:center;
padding:35px;
color:#888;
}

</style>

</head>

<body>

<header>

<a href="index.html">← Ana Sayfa</a>

</header>

<main>

<h1>Galeri</h1>

<div class="gallery">

<img src="galeri1.jpg" alt="Yusuf Bitim şiir galerisi">

<img src="galeri2.jpg" alt="Şiir ve sanat">

<img src="galeri3.jpg" alt="Edebi görsel">

<img src="galeri4.jpg" alt="Yusuf Bitim şiir kitabı">

<img src="galeri5.jpg" alt="Yusuf Bitim şiir kitabı">

<img src="yusuf-bitim-1.jpg" alt="Yusuf Bitim">

<img src="yusuf-bitim-2.jpg" alt="Yusuf Bitim">

<img src="yusuf-bitim-3.jpg" alt="Yusuf Bitim">

<img src="yusuf-bitim-4.jpg" alt="Yusuf Bitim">

<img src="yusuf-bitim-5.png" alt="Yusuf Bitim">

<img src="yusuf-bitim-6.png" alt="Yusuf Bitim">

<img src="yusuf-bitim-7.png" alt="Yusuf Bitim">

</div>
  
</main>

  <!-- Resim Büyütme -->
<div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img id="lightbox-img">
</div>

<style>
.lightbox{
display:none;
position:fixed;
z-index:9999;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.95);
justify-content:center;
align-items:center;
}

.lightbox img{
max-width:90%;
max-height:90%;
border-radius:10px;
box-shadow:0 0 30px rgba(255,255,255,.3);
}

.close{
position:absolute;
top:20px;
right:35px;
font-size:45px;
color:white;
cursor:pointer;
}
</style>

<script>

const lightbox=document.getElementById("lightbox");
const lightboxImg=document.getElementById("lightbox-img");

document.querySelectorAll(".gallery img").forEach(img=>{

img.addEventListener("click",()=>{

lightbox.style.display="flex";
lightboxImg.src=img.src;
lightboxImg.alt=img.alt;

});

});

lightbox.addEventListener("click",(e)=>{

if(e.target!==lightboxImg){

lightbox.style.display="none";

}

});

</script>
  
<footer>

© 2026 Yusuf Bitim • Tüm Hakları Saklıdır.

</footer>

</body>

</html>
