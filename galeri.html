<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galeri | Yusuf Bitim</title>

<meta name="description" content="Yusuf Bitim şiir dünyasından görseller, sanat ve ilham galerisi.">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

header{
background:#000;
padding:20px;
text-align:center;
}

header a{
color:#d4af37;
text-decoration:none;
font-weight:bold;
font-size:18px;
}

main{
max-width:1000px;
margin:50px auto;
padding:20px;
}

h1{
text-align:center;
color:#d4af37;
margin-bottom:40px;
font-size:38px;
}

.gallery{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;

}

.gallery img{

width:100%;
height:250px;
object-fit:cover;
border-radius:15px;
border:2px solid #d4af37;
transition:.3s;

}

.gallery img:hover{

transform:scale(1.05);

}


footer{

text-align:center;
padding:35px;
color:#888;

}

</style>

</head>


<body>


<header>

<a href="index.html">← Ana Sayfa</a>

</header>


<main>

<h1>Galeri</h1>


<div class="gallery">


<img src="galeri1.jpg" alt="Yusuf Bitim şiir galerisi">

<img src="galeri2.jpg" alt="Şiir ve sanat">

<img src="galeri3.jpg" alt="Edebi görsel">

</div>


</main>


<footer>

</body>
